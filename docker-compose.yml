version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iwashslot-backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=production_secure_jwt_secret_key_987654321
      - ADMIN_ID=js200004
      - ADMIN_PASSWORD=admin
    volumes:
      - db-data:/app/prisma

volumes:
  db-data:
